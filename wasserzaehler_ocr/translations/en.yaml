configuration:
  camera_entity:
    name: Kamera-Entität
    description: Entity-ID der ESPHome-Kamera in Home Assistant, z. B. camera.watermeter.
  light_entity:
    name: Lampen-Entität
    description: Entity-ID der Kamera-Lampe (light. oder switch.), die vor dem Foto eingeschaltet wird. Leer lassen, wenn keine Lampe geschaltet werden soll.
  light_warmup:
    name: Wartezeit nach Licht-an (Sek.)
    description: Sekunden, die nach dem Einschalten der Lampe bis zum Foto gewartet wird. Standard 10.
  dst_path:
    name: Zielbild (zugeschnitten)
    description: Pfad, unter dem das rotierte und zugeschnittene Bild gespeichert wird (für die local_file-Kamera).
  src_path:
    name: Rohbild-Pfad
    description: Pfad, unter dem das von der Kamera geholte Rohbild abgelegt wird.
  save_source:
    name: Rohbild speichern
    description: Wenn aktiv, wird das ungeschnittene Kamerabild unter dem Rohbild-Pfad behalten (nützlich zum Kalibrieren der Zuschnittwerte).
  rotate_angle:
    name: Drehwinkel
    description: Grad, positiv = gegen den Uhrzeigersinn. Standard 53.
  fill_color:
    name: Füllfarbe der Ecken
    description: Farbe, mit der die durch die Drehung entstehenden Ecken gefüllt werden.
  crop_top:
    name: Zuschnitt oben
    description: Pixel, die nach der Rotation oben abgeschnitten werden.
  crop_bottom:
    name: Zuschnitt unten
    description: Pixel, die nach der Rotation unten abgeschnitten werden.
  crop_left:
    name: Zuschnitt links
    description: Pixel, die nach der Rotation links abgeschnitten werden.
  crop_right:
    name: Zuschnitt rechts
    description: Pixel, die nach der Rotation rechts abgeschnitten werden.
  jpeg_quality:
    name: JPEG-Qualität
    description: JPEG-Qualität 1-95 des Ausgabebilds.
  jpeg_subsampling:
    name: JPEG-Subsampling
    description: 0 = 4:4:4 (beste Kantenschärfe für Ziffern), 1 = 4:2:2, 2 = 4:2:0.
  ollama_url:
    name: Ollama-URL
    description: Vollständige URL des ausgelagerten Ollama-Servers, z. B. http://192.168.3.50:11434/api/generate.
  ollama_model:
    name: Ollama-Modell
    description: Name des Vision-Modells, z. B. gemma4:e2b.
  ollama_keep_alive:
    name: Modell im RAM halten (Sek.)
    description: 0 = Modell nach jedem Lauf entladen. Höherer Wert hält es geladen (schneller, mehr RAM-Nutzung).
  ollama_timeout:
    name: Ollama-Timeout (Sek.)
    description: Maximale Wartezeit auf die Antwort des Modells.
  ocr_main_digits:
    name: Hauptziffern (schwarz)
    description: Anzahl der schwarzen Vorkomma-Ziffern des Zählwerks. Standard 5.
  ocr_decimal_digits:
    name: Nachkommaziffern (rot)
    description: Anzahl der roten Nachkomma-Ziffern. Standard 3.
  plausibility_check:
    name: Plausibilitätsprüfung
    description: Wenn aktiv, wird der neue Wert gegen den letzten gültigen geprüft (Monotonie und maximaler Sprung).
  max_increase:
    name: Maximaler Zuwachs
    description: Größter erlaubter Anstieg gegenüber dem letzten Wert (in m³). Größere Sprünge gelten als unplausibel.
  allow_equal:
    name: Gleicher Wert erlaubt
    description: Wenn aktiv, darf der neue Wert gleich dem letzten sein. Wenn aus, muss er echt größer sein.
  reject_implausible:
    name: Unplausible Werte verwerfen
    description: Wenn aktiv, wird ein unplausibler Wert nicht als frischer Wert übernommen. Wenn aus, wird er geliefert, aber als plausible=false markiert.
  hold_last_on_failure:
    name: Letzten Wert halten
    description: Wenn aktiv, behält der Zählerstand bei einer fehlgeschlagenen oder unplausiblen Ablesung den letzten gültigen Wert (Sensor fällt nicht auf „unbekannt"). Status und Fehlerzähler zeigen den Fehler trotzdem an.
  last_value_path:
    name: Speicherpfad letzter Wert
    description: Datei, in der der letzte gültige Wert für den Vergleich abgelegt wird.
  log_max_bytes:
    name: Max. Logdateigröße
    description: Ab dieser Größe (Bytes) wird die Logdatei neu begonnen.
